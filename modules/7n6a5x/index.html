<section class="modulex-ue" id="modulex-ue-{{id}}" aria-labelledby="modulex-ue-{{id}}-h">
  <article class="modulex-ue-card">
    <header class="modulex-ue-head">
      <div class="modulex-ue-heads">
        <p class="modulex-ue-kicker">{{title}}</p>
        <h2 class="modulex-ue-name" id="modulex-ue-{{id}}-h">{{ueName}}</h2>
        {{ueNet}}
      </div>
      {{uePrint}}
    </header>
    <div class="modulex-ue-grid">
      <div class="modulex-ue-col">
        {{ueAllergen}}
        <dl class="modulex-ue-list">{{ueInfo}}</dl>
      </div>
      <div class="modulex-ue-col">
        <h3 class="modulex-ue-h3">{{nutritionTitle}}</h3>
        {{ueTable}}
        {{ueServ}}
      </div>
    </div>
    {{ueNote}}
  </article>
</section>

<style>
  .modulex-ue { box-sizing: border-box; width: 100%; padding: 32px 20px; background: --bgcolor--; color: --textcolor--; font-size: 16px; line-height: 1.5; }
  .modulex-ue *, .modulex-ue *::before, .modulex-ue *::after { box-sizing: border-box; }
  /* Ham css.css * kurali font-size:14px/weight:400 yazar → iç ögeler üst değeri miras alsın */
  .modulex-ue :where(*) { font-size: inherit; font-weight: inherit; line-height: inherit; }
  .modulex-ue .material-symbols-outlined { font-size: 22px; line-height: 1; font-weight: 400; }
  .modulex-ue-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .modulex-ue-card {
    max-width: --max--; margin-inline: auto; padding: 28px; background: --surface--; border: 1px solid --bordercolor--; border-radius: 20px;
    animation: modulexUeIn 0.4s ease both;
  }
  @keyframes modulexUeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .modulex-ue-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; padding-block-end: 18px; border-block-end: 2px solid --textcolor--; }
  .modulex-ue-kicker { margin: 0 0 4px; color: --mutedcolor--; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; }
  .modulex-ue-name { margin: 0 0 8px; font-size: 1.75rem; font-weight: 800; line-height: 1.2; }
  .modulex-ue-net { display: inline-block; padding: 4px 12px; background: --bgcolor--; border: 1px solid --bordercolor--; border-radius: 999px; font-weight: 700; }
  .modulex-ue-net > span { font-weight: 500; color: --mutedcolor--; }
  .modulex-ue-print {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; min-height: 44px; padding-inline: 16px;
    background: --bgcolor--; color: --textcolor--; border: 1px solid --bordercolor--; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .modulex-ue-print:hover { background: --surface2--; border-color: --accent--; }
  .modulex-ue :focus-visible { outline: 2px solid --accent--; outline-offset: 2px; }
  .modulex-ue-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; padding-block: 20px; }
  .modulex-ue-col { min-width: 0; }
  .modulex-ue-warn { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin-block-end: 16px; background: --bgcolor--; border: 2px solid --textcolor--; border-radius: 12px; }
  .modulex-ue .modulex-ue-warn .material-symbols-outlined { flex: none; color: --accent--; font-size: 28px; }
  .modulex-ue-warnt { margin: 0 0 6px; font-weight: 700; }
  .modulex-ue-warnl { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .modulex-ue-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: --textcolor--; color: --bgcolor--; font-weight: 700; }
  .modulex-ue-ok { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; color: --mutedcolor--; font-weight: 600; }
  .modulex-ue-list { margin: 0; }
  .modulex-ue-row { padding-block: 12px; border-block-end: 1px solid --bordercolor--; }
  .modulex-ue-row dt { margin: 0 0 2px; color: --mutedcolor--; font-size: 0.85rem; font-weight: 600; }
  .modulex-ue-row dd { margin: 0; overflow-wrap: anywhere; }
  .modulex-ue-row dd strong { font-weight: 800; }
  .modulex-ue-code { font-weight: 700; }
  .modulex-ue-h3 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 700; }
  .modulex-ue-table { width: 100%; border-collapse: collapse; background: --bgcolor--; border: 1px solid --bordercolor--; }
  .modulex-ue-table th, .modulex-ue-table td { padding: 8px 12px; text-align: start; border-block-end: 1px solid --bordercolor--; font-weight: 400; }
  .modulex-ue-table thead th { background: --surface2--; font-weight: 700; }
  .modulex-ue-table tbody th { font-weight: 600; }
  .modulex-ue-table .modulex-ue-num { text-align: end; white-space: nowrap; }
  .modulex-ue-table tr.modulex-ue-sub th { padding-inline-start: 28px; font-weight: 400; color: --mutedcolor--; }
  .modulex-ue-serv { margin: 10px 0 0; color: --mutedcolor--; font-size: 0.9rem; }
  .modulex-ue-note { margin: 0; padding-block-start: 14px; border-block-start: 1px dashed --bordercolor--; color: --mutedcolor--; font-size: 0.85rem; }
  @media (max-width: 768px) {
    .modulex-ue { padding: 20px 12px; }
    .modulex-ue-card { padding: 18px; }
    .modulex-ue-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .modulex-ue-name { font-size: 1.4rem; }
    .modulex-ue-print { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ue *, .modulex-ue *::before, .modulex-ue *::after { animation: none !important; transition: none !important; }
  }
  /* Yazdirma: sade siyah-beyaz, dugme gizli, kart bolunmez */
  @media print {
    .modulex-ue { padding: 0; background: #fff; color: #000; }
    .modulex-ue-card { max-width: none; border: 1px solid #000; background: #fff; break-inside: avoid; animation: none; }
    .modulex-ue-print { display: none; }
    .modulex-ue-grid { grid-template-columns: 1fr 1fr; }
    .modulex-ue-table, .modulex-ue-table th, .modulex-ue-table td { border-color: #000; }
  }
</style>

<script>
(function () {
  var kok = document.getElementById("modulex-ue-{{id}}");
  if (!kok) { return; }
  var dugme = kok.querySelector("[data-ue-print]");
  if (dugme) { dugme.addEventListener("click", function () { window.print(); }); }
})();
</script>
