<section class="modulex-gj2" id="gj2-{{id}}" data-gj2-sayac="{{counter}}">
  <div class="modulex-gj2-wrap">
    {{gj2head}}
    {{gj2empty}}
    <ul class="modulex-gj2-rows">{{gj2items}}</ul>
  </div>
  <dialog class="modulex-gj2-lb" aria-label="{{dialogLabel}}">
    <div class="modulex-gj2-lb-ic">
      <button type="button" class="modulex-gj2-lb-btn modulex-gj2-lb-kapat" data-gj2-kapat aria-label="{{closeLabel}}"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
      <button type="button" class="modulex-gj2-lb-btn modulex-gj2-lb-onceki" data-gj2-onceki aria-label="{{prevLabel}}"><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
      <figure class="modulex-gj2-lb-fig">
        <img class="modulex-gj2-lb-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
        <figcaption class="modulex-gj2-lb-cap"><span data-gj2-baslik></span> <span class="modulex-gj2-lb-say" data-gj2-say></span></figcaption>
      </figure>
      <button type="button" class="modulex-gj2-lb-btn modulex-gj2-lb-sonraki" data-gj2-sonraki aria-label="{{nextLabel}}"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
    </div>
  </dialog>
</section>

<style>
  /* Galeri — hizalı satırlar (galeri-masonry-2). Satır yüksekliği sabit, genişlik oranla büyür. */
  .modulex-gj2 {
    box-sizing: border-box; width: 100%; --gj2-h: --rowHeight--;
    padding-block: clamp(36px, 6vw, 80px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-gj2 *, .modulex-gj2 *::before, .modulex-gj2 *::after { box-sizing: border-box; }
  .modulex-gj2 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-gj2-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-gj2-head { margin-block-end: 24px; }
  .modulex-gj2-title { margin: 0 0 8px; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem); line-height: 1.2; color: --textcolor--; }
  .modulex-gj2-desc { margin: 0; max-width: 60ch; line-height: 1.7; color: --mutedcolor--; }
  .modulex-gj2-bos { margin: 0; color: --mutedcolor--; }

  .modulex-gj2-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: --gap--; }
  /* son satır doldurucu: son satırdaki görseller aşırı büyümesin */
  .modulex-gj2-rows::after { content: ""; flex-grow: 999; }
  .modulex-gj2-item { position: relative; flex-grow: var(--gj2-r); flex-basis: calc(var(--gj2-h) * var(--gj2-r)); height: var(--gj2-h); min-width: 0; }
  .modulex-gj2-link { display: block; width: 100%; height: 100%; overflow: hidden; border-radius: --radius--; background: --surface2--; }
  .modulex-gj2-img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
  .modulex-gj2-link:hover .modulex-gj2-img { transform: scale(1.04); }
  .modulex-gj2 a.modulex-gj2-link:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-gj2-ph { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: --mutedcolor--; }
  .modulex-gj2-ph .material-symbols-outlined { font-size: 40px; }

  /* Lightbox: yerel dialog (showModal → odak tuzağı + Esc tarayıcıdan) */
  .modulex-gj2-lb { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: --onimage--; }
  .modulex-gj2-lb::backdrop { background: --scrim--; }
  .modulex-gj2-lb-ic { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 100%; padding: 56px 12px 24px; }
  .modulex-gj2-lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: min(1200px, 100%); min-width: 0; }
  .modulex-gj2-lb-img { display: block; max-width: 100%; max-height: calc(100vh - 140px); object-fit: contain; border-radius: 4px; }
  .modulex-gj2-lb-cap { font-size: 0.95rem; text-align: center; color: --onimage--; }
  .modulex-gj2-lb-say { opacity: 0.8; margin-inline-start: 8px; font-variant-numeric: tabular-nums; }
  .modulex-gj2-lb-btn {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid color-mix(in srgb, --onimage-- 45%, transparent); background: color-mix(in srgb, --scrim-- 60%, transparent); color: --onimage--; cursor: pointer;
  }
  .modulex-gj2-lb-btn:hover { background: --scrim--; }
  .modulex-gj2-lb-btn:focus-visible { outline: 3px solid --onimage--; outline-offset: 2px; }
  .modulex-gj2-lb-kapat { position: absolute; top: 8px; inset-inline-end: 8px; }
  [dir="rtl"] .modulex-gj2-lb-onceki .material-symbols-outlined, [dir="rtl"] .modulex-gj2-lb-sonraki .material-symbols-outlined { transform: scaleX(-1); }

  @media (max-width: 640px) {
    .modulex-gj2 { --gj2-h: 140px; }
    .modulex-gj2-lb-onceki, .modulex-gj2-lb-sonraki { position: absolute; bottom: 16px; }
    .modulex-gj2-lb-onceki { inset-inline-start: 16px; }
    .modulex-gj2-lb-sonraki { inset-inline-end: 16px; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-gj2 *, .modulex-gj2 *::before, .modulex-gj2 *::after { animation: none !important; transition: none !important; }
    .modulex-gj2-link:hover .modulex-gj2-img { transform: none; }
  }
</style>

<script>
  /* Lightbox: <dialog>.showModal yoksa bağlantı doğal davranır (görsel yeni sayfada açılır). */
  (function () {
    var kok = document.getElementById("gj2-{{id}}");
    if (!kok || kok.getAttribute("data-gj2-hazir") === "1") { return; }
    kok.setAttribute("data-gj2-hazir", "1");
    var dlg = kok.querySelector("dialog");
    if (!dlg || typeof dlg.showModal !== "function") { return; }
    var linkler = kok.querySelectorAll("[data-gj2-src]");
    var img = dlg.querySelector("img");
    var baslik = dlg.querySelector("[data-gj2-baslik]");
    var say = dlg.querySelector("[data-gj2-say]");
    var sablon = kok.getAttribute("data-gj2-sayac") || "{i} / {n}";
    var aktif = 0;
    var donus = null;
    function goster(i) {
      aktif = (i + linkler.length) % linkler.length;
      var a = linkler[aktif];
      img.src = a.getAttribute("data-gj2-src");
      img.alt = a.getAttribute("data-gj2-alt") || "";
      baslik.textContent = a.getAttribute("data-gj2-title") || "";
      say.textContent = linkler.length > 1 ? sablon.replace("{i}", aktif + 1).replace("{n}", linkler.length) : "";
    }
    var i;
    for (i = 0; i < linkler.length; i++) {
      (function (n) {
        linkler[n].addEventListener("click", function (e) {
          e.preventDefault();
          donus = linkler[n];
          goster(n);
          dlg.showModal();
        });
      })(i);
    }
    var tek = linkler.length < 2;
    dlg.querySelector("[data-gj2-onceki]").hidden = tek;
    dlg.querySelector("[data-gj2-sonraki]").hidden = tek;
    dlg.querySelector("[data-gj2-onceki]").addEventListener("click", function () { goster(aktif - 1); });
    dlg.querySelector("[data-gj2-sonraki]").addEventListener("click", function () { goster(aktif + 1); });
    dlg.querySelector("[data-gj2-kapat]").addEventListener("click", function () { dlg.close(); });
    dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.classList.contains("modulex-gj2-lb-ic")) { dlg.close(); } });
    dlg.addEventListener("keydown", function (e) {
      if (tek) { return; }
      var rtl = document.documentElement.dir === "rtl";
      if (e.key === "ArrowRight") { goster(aktif + (rtl ? -1 : 1)); }
      else if (e.key === "ArrowLeft") { goster(aktif + (rtl ? 1 : -1)); }
    });
    dlg.addEventListener("close", function () { if (donus) { donus.focus(); } });
  })();
</script>
